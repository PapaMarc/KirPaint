<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Payment - KirPaint</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .payment-hero {
            background-image: url('/images/images/header.jpg');
        }

        .payment-wrap {
            padding: 56px 0;
        }

        .payment-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.14);
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
            text-align: center;
        }

        .payment-card h2 {
            margin-bottom: 14px;
        }

        .payment-card img {
            display: block;
            width: 100%;
            max-width: 760px;
            height: auto;
            margin: 0 auto;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <nav class="topnav">
        <div class="container nav-inner">
            <a class="logo" href="/index.html">KirPaint, Inc.</a>
            <a class="logo" href="/index.html">Home</a>
        </div>
    </nav>

    <header class="hero-hero payment-hero">
        <div class="container">
            <h1>Payment</h1>
            <p class="lead">Zelle payment information for KirPaint.</p>
        </div>
    </header>

    <main>
        <section class="payment-wrap">
            <div class="container">
                <article class="payment-card">
                    <h2>Zelle</h2>
                    <img src="/images/ZelleKirPaint.jpg" alt="KirPaint Zelle payment information" />
                </article>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; KirPaint | All Rights Reserved | Website Created by <a href="https://merware.com">MerWare</a></p>
        </div>
    </footer>
</body>

</html>
